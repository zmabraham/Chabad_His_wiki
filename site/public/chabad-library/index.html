<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספריית חב״ד ליובאוויטש</title>
<style>
  :root {
    --gold: #b8860b;
    --gold-light: #f5e6a3;
    --dark: #1a1008;
    --mid: #3d2b0e;
    --bg: #fdf8ef;
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Times New Roman', serif; background: var(--bg); color: var(--dark); display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--mid); color: #f0e0b0;
    display: flex; flex-direction: column; overflow: hidden;
    border-left: 3px solid var(--gold);
  }
  #sidebar-header {
    background: var(--dark); padding: 16px 12px; text-align: center;
    border-bottom: 2px solid var(--gold);
  }
  #sidebar-header h1 { font-size: 17px; color: var(--gold-light); line-height: 1.4; }
  #sidebar-header p { font-size: 11px; color: #b09060; margin-top: 4px; }
  #search-box {
    padding: 10px; background: #2a1c06; border-bottom: 1px solid #5a3c10;
  }
  #search-box input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--gold);
    background: #1a1008; color: #f0e0b0; border-radius: 4px;
    font-size: 14px; text-align: right; direction: rtl;
  }
  #search-box input::placeholder { color: #806040; }
  #cat-list { flex: 1; overflow-y: auto; }
  .cat-header {
    padding: 10px 12px; background: #2a1c06; cursor: pointer;
    border-bottom: 1px solid #4a2c0a; display: flex; align-items: center;
    gap: 8px; font-size: 13px; color: var(--gold-light); font-weight: bold;
    user-select: none;
  }
  .cat-header:hover { background: #3a2410; }
  .cat-header .eng { font-size: 11px; color: #a07840; margin-right: auto; }
  .cat-header .arrow { font-size: 10px; color: #806040; transition: transform 0.2s; }
  .cat-header.open .arrow { transform: rotate(90deg); }
  .book-list { display: none; }
  .book-list.open { display: block; }
  .book-item {
    padding: 8px 12px 8px 20px; cursor: pointer;
    border-bottom: 1px solid #3a2008; font-size: 13px; color: #d0b080;
    display: flex; justify-content: space-between; align-items: center;
  }
  .book-item:hover { background: #3a2410; color: var(--gold-light); }
  .book-item.active { background: var(--gold); color: var(--dark); font-weight: bold; }
  .book-item .meta { font-size: 10px; color: #807050; }
  .book-item.active .meta { color: #5a3c00; }

  /* Main content */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #toolbar {
    background: var(--dark); color: var(--gold-light); padding: 10px 20px;
    display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--gold);
    flex-shrink: 0;
  }
  #toolbar h2 { font-size: 16px; flex: 1; }
  #toolbar .stats { font-size: 12px; color: #a07840; }
  #search-text-box {
    padding: 6px 12px; border: 1px solid var(--gold); background: #2a1c06;
    color: #f0e0b0; border-radius: 4px; font-size: 13px; width: 200px;
    text-align: right; direction: rtl;
  }
  #font-btns button {
    background: #2a1c06; color: var(--gold-light); border: 1px solid var(--gold);
    padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 13px;
  }
  #font-btns button:hover { background: var(--gold); color: var(--dark); }
  #content-area {
    flex: 1; overflow-y: auto; padding: 30px 40px;
    font-size: 18px; line-height: 2.0;
  }
  #welcome {
    text-align: center; padding: 60px 20px; color: #806040;
  }
  #welcome h2 { font-size: 28px; color: var(--gold); margin-bottom: 16px; }
  #welcome p { font-size: 15px; max-width: 500px; margin: 0 auto 12px; }
  #book-text { display: none; direction: rtl; text-align: right; }
  #book-text h1 { font-size: 22px; color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 8px; margin-bottom: 20px; }
  #book-text .section-title {
    font-size: 16px; font-weight: bold; color: var(--mid);
    border-top: 1px solid #d0b080; padding: 16px 0 6px;
    margin-top: 8px;
  }
  #book-text p { margin-bottom: 12px; }
  .highlight { background: var(--gold-light); border-radius: 2px; }
  #loading { text-align: center; padding: 60px; color: #a07840; font-size: 18px; display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #2a1c06; }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>ספריית חב״ד ליובאוויטש</h1>
    <p>Chabad Library — Full Texts</p>
  </div>
  <div id="search-box">
    <input type="text" id="book-search" placeholder="חפש ספר... / Search book..." oninput="filterBooks()">
  </div>
  <div id="cat-list"></div>
</div>

<div id="main">
  <div id="toolbar">
    <h2 id="book-title">בחר ספר</h2>
    <span class="stats" id="book-stats"></span>
    <input type="text" id="search-text-box" placeholder="חפש בטקסט..." oninput="searchInText()" style="display:none">
    <div id="font-btns" style="display:none">
      <button onclick="changeFont(-2)">א-</button>
      <button onclick="changeFont(2)">א+</button>
    </div>
  </div>
  <div id="content-area">
    <div id="welcome">
      <h2>ספריית חב״ד ליובאוויטש</h2>
      <p>16,467 עמודים מ-62 ספרים</p>
      <p>16,467 pages from 62 books</p>
      <p style="margin-top:24px; font-size:13px; color:#a07840">בחר ספר מהתפריט הימני<br>Select a book from the right sidebar</p>
    </div>
    <div id="loading">טוען... Loading...</div>
    <div id="book-text"></div>
  </div>
</div>

<script>
let booksData = null;
let currentBook = null;
let fontSize = 18;

async function init() {
  const resp = await fetch('books.json');
  booksData = await resp.json();
  renderSidebar();
}

function renderSidebar(filter = '') {
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  const fl = filter.toLowerCase();

  booksData.categories.forEach((cat, ci) => {
    const books = booksData.books.filter(b => b.cat === ci &&
      (!fl || b.title.includes(filter) || b.id.includes(fl) || cat.heb.includes(filter) || cat.eng.toLowerCase().includes(fl)));
    if (!books.length && fl) return;

    const catDiv = document.createElement('div');

    const header = document.createElement('div');
    header.className = 'cat-header' + (fl ? ' open' : '');
    header.innerHTML = `<span>${cat.heb}</span><span class="eng">${cat.eng}</span><span class="arrow">▶</span>`;
    header.onclick = () => {
      header.classList.toggle('open');
      bookList.classList.toggle('open');
    };

    const bookList = document.createElement('div');
    bookList.className = 'book-list' + (fl ? ' open' : '');

    books.forEach(book => {
      const item = document.createElement('div');
      item.className = 'book-item' + (currentBook === book.id ? ' active' : '');
      const sizeKB = Math.round(book.size / 1024);
      const sizeStr = sizeKB > 1024 ? `${(sizeKB/1024).toFixed(1)}MB` : `${sizeKB}KB`;
      item.innerHTML = `<span>${book.title}</span><span class="meta">${book.pages}p · ${sizeStr}</span>`;
      item.onclick = () => loadBook(book);
      bookList.appendChild(item);
    });

    catDiv.appendChild(header);
    catDiv.appendChild(bookList);
    list.appendChild(catDiv);
  });
}

async function loadBook(book) {
  currentBook = book.id;
  renderSidebar(document.getElementById('book-search').value);

  document.getElementById('book-title').textContent = book.title;
  const sizeKB = Math.round(book.size / 1024);
  document.getElementById('book-stats').textContent = `${book.pages} pages · ${sizeKB > 1024 ? (sizeKB/1024).toFixed(1)+'MB' : sizeKB+'KB'}`;
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('book-text').style.display = 'none';
  document.getElementById('search-text-box').style.display = '';
  document.getElementById('font-btns').style.display = '';

  try {
    const resp = await fetch(`books/${book.id}.txt`);
    const text = await resp.text();
    renderBookText(text);
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('book-text').innerHTML = '<p style="color:red">Error loading file</p>';
    document.getElementById('book-text').style.display = 'block';
  }
}

function renderBookText(rawText) {
  const lines = rawText.split('\n');
  let html = '';
  let skipFirst2 = 0;

  for (const line of lines) {
    if (skipFirst2 < 2 && line.startsWith('#')) { skipFirst2++; continue; }
    if (line === '============================================================') {
      html += '</div>';
    } else if (line.startsWith('======')) {
      html += '<div class="section-title">';
    } else if (line.trim() === '') {
      html += '<br>';
    } else {
      html += `<p>${escHtml(line)}</p>`;
    }
  }

  document.getElementById('loading').style.display = 'none';
  const bookDiv = document.getElementById('book-text');
  bookDiv.innerHTML = `<h1>${escHtml(document.getElementById('book-title').textContent)}</h1>` + html;
  bookDiv.style.display = 'block';
  bookDiv.style.fontSize = fontSize + 'px';
  document.getElementById('content-area').scrollTop = 0;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function filterBooks() {
  renderSidebar(document.getElementById('book-search').value);
}

function searchInText() {
  const q = document.getElementById('search-text-box').value;
  const bookDiv = document.getElementById('book-text');
  // Clear previous highlights
  bookDiv.innerHTML = bookDiv.innerHTML.replace(/<mark class="highlight">([^<]*)<\/mark>/g, '$1');
  if (!q || q.length < 2) return;
  const walker = document.createTreeWalker(bookDiv, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    if (node.textContent.includes(q)) {
      const span = document.createElement('span');
      span.innerHTML = node.textContent.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'),
        `<mark class="highlight">${q}</mark>`);
      node.parentNode.replaceChild(span, node);
    }
  });
  // Scroll to first highlight
  const first = bookDiv.querySelector('.highlight');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function changeFont(delta) {
  fontSize = Math.max(12, Math.min(32, fontSize + delta));
  document.getElementById('book-text').style.fontSize = fontSize + 'px';
}

init();
</script>
</body>
</html>
