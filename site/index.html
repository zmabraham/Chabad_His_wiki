<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undaunted Knowledge System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F4EFE5; --cream2: #E8E4DA; --ink: #1a1a1a; --ink2: #4a4a4a; --ink3: #8a8a8a;
      --accent: #8B2635; --sel: rgba(139,38,53,0.15);
      --person: #4A6FA5; --place: #8B7355; --event: #C45C3E;
      --time: #6B8E4F; --quote: #7B6B8E; --concept: #A67C52;
    }
    body { font-family: Georgia, 'Times New Roman', serif; background: var(--cream); color: var(--ink); font-size: 15px; }
    #app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 220px 1fr 280px; min-height: 100vh; }

    /* Header */
    .header { grid-column: 1/-1; padding: 16px 24px 12px; border-bottom: 1px solid #d0c8bc; background: #fff; display: flex; align-items: baseline; gap: 16px; }
    .header h1 { font-size: 1.3rem; color: var(--accent); }
    .stats { font-size: 12px; color: var(--ink3); }

    /* Chapter nav */
    #chapter-nav { overflow-y: auto; border-right: 1px solid #d0c8bc; background: #faf7f2; padding: 8px 0; }
    .chapter-nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; transition: background 0.15s; }
    .chapter-nav-item:hover { background: rgba(139,38,53,0.06); }
    .chapter-nav-item.active { background: var(--sel); color: var(--accent); font-weight: 600; }
    .chapter-num { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; min-width: 16px; }
    .chapter-name { line-height: 1.3; }

    /* Source pane */
    #source-content { overflow-y: auto; padding: 24px 32px; height: calc(100vh - 57px); }
    .chapter-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--accent); }
    .chapter-header-num { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink3); margin-bottom: 4px; }
    .chapter-header-title { font-size: 1.5rem; font-weight: 600; color: var(--accent); }
    .chapter-header-pages { font-size: 12px; color: var(--ink3); margin-top: 4px; }
    .page-block { margin-bottom: 20px; position: relative; }
    .page-num { font-size: 10px; color: var(--ink3); letter-spacing: 0.08em; margin-bottom: 6px; }
    .page-text { font-size: 15px; line-height: 1.85; white-space: pre-wrap; color: var(--ink2); }
    .loading { padding: 3rem; text-align: center; color: var(--ink3); font-style: italic; }

    /* Entity tags */
    .entity-tag { cursor: pointer; transition: opacity 0.15s; }
    .entity-tag:hover { opacity: 0.75; }
    .entity-tag.person { color: #2a4a65; }
    .entity-tag.place  { color: #5a4a35; }
    .entity-tag.event  { color: #6a2a1a; }
    .entity-tag.time   { color: #2a4a2a; }
    .entity-tag.quote  { color: #4a3a5a; }
    .entity-tag.concept{ color: #5a4a2a; }

    /* Right panel */
    .right-panel { border-left: 1px solid #d0c8bc; background: #faf7f2; display: flex; flex-direction: column; height: calc(100vh - 57px); overflow: hidden; }
    .right-top { padding: 12px; border-bottom: 1px solid #d0c8bc; }
    #entity-search { width: 100%; padding: 6px 8px; border: 1px solid #d0c8bc; border-radius: 4px; font-size: 13px; background: #fff; outline: none; font-family: inherit; }
    #entity-search:focus { border-color: var(--accent); }
    .filters { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid #d0c8bc; }
    .filter-btn { padding: 3px 8px; border: 1px solid #d0c8bc; background: #fff; cursor: pointer; font-size: 11px; border-radius: 3px; font-family: inherit; }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #entity-list { flex: 1; overflow-y: auto; }
    .entity-item { padding: 8px 12px; cursor: pointer; transition: background 0.12s; }
    .entity-item:hover { background: rgba(139,38,53,0.05); }
    .entity-name { font-weight: 600; font-size: 13px; }
    .entity-type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    #entity-detail { padding: 14px; border-top: 1px solid #d0c8bc; max-height: 280px; overflow-y: auto; font-size: 13px; }
    .detail-empty { color: var(--ink3); font-style: italic; text-align: center; padding: 12px; }
    .detail-type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .detail-name { font-size: 1.05rem; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    .detail-aliases { font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
    .detail-meta { font-size: 12px; color: var(--ink2); margin-bottom: 2px; }
    .detail-desc { font-size: 13px; color: var(--ink2); line-height: 1.6; margin-top: 8px; }
    .detail-mentions { font-size: 11px; color: var(--accent); margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Undaunted Knowledge System</h1>
    <span class="stats" id="stats">Loading…</span>
  </div>

  <nav id="chapter-nav">
    <div class="loading">…</div>
  </nav>

  <div id="source-content">
    <div class="loading">Loading…</div>
  </div>

  <div class="right-panel">
    <div class="right-top">
      <input type="search" id="entity-search" placeholder="Search entities…" autocomplete="off">
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="person">People</button>
      <button class="filter-btn" data-type="place">Places</button>
      <button class="filter-btn" data-type="event">Events</button>
      <button class="filter-btn" data-type="time">Times</button>
      <button class="filter-btn" data-type="concept">Concepts</button>
    </div>
    <div id="entity-list">
      <div class="loading">Loading…</div>
    </div>
    <div id="entity-detail">
      <div class="detail-empty">Select an entity to see details</div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
